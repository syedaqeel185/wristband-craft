services:
  postgres:
    image: postgres:16-alpine
    container_name: wristband_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wristband
      POSTGRES_PASSWORD: wristband
      POSTGRES_DB: wristband
    ports:
      - "5433:5432"
    volumes:
      - wristband_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wristband -d wristband"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wristband_pgdata:
